AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend Serverless de Gestao de Carteira e Frontend Hosting com S3 e CloudFront

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.13
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref PortfolioTable

Resources:
  # 1. Cognito User Pool (Autenticacao por Username)
  PortfolioUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: PortfolioUserPool
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  # 2. Cognito User Pool Client
  PortfolioUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: PortfolioWebClient
      UserPoolId: !Ref PortfolioUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # 3. Base de Dados DynamoDB
  PortfolioTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PortfolioData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # 4. HTTP API Gateway com JWT Authorizer associado ao Cognito
  PortfolioHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Audience:
                - !Ref PortfolioUserPoolClient
              Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${PortfolioUserPool}"

  # 5. Lambda Principal
  PortfolioApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortfolioTable
      Events:
        GetPortfolio:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /portfolio
            Method: GET
        PostTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /transaction
            Method: POST

  # 6. Bucket S3 para hospedar os ficheiros compilados do Frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portfolio-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 7. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "PortfolioOAC-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 8. Distribuicao CloudFront
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: "Distribuicao CloudFront para o Portfolio Web"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # 9. Politica de Bucket S3 permitindo leitura exclusiva via CloudFront OAC
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

Outputs:
  ApiUrl:
    Description: "URL base da API Gateway"
    Value: !Sub "https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: "ID do User Pool no Cognito"
    Value: !Ref PortfolioUserPool
  UserPoolClientId:
    Description: "ID do Client da aplicacao no Cognito"
    Value: !Ref PortfolioUserPoolClient
  FrontendBucketName:
    Description: "Nome do Bucket S3 do Frontend"
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: "ID da Distribuicao CloudFront"
    Value: !Ref CloudFrontDistribution
  FrontendUrl:
    Description: "URL publico do Frontend (HTTPS)"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"